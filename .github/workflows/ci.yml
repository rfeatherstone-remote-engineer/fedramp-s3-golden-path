name: FedRAMP High Terraform Guardrails CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  terraform-static-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false && terraform validate
      - working-directory: examples/basic
        run: terraform init -backend=false && terraform validate && terraform plan -out=tfplan.binary && terraform show -json tfplan.binary > tfplan.json
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: examples/basic, trivyignores: .trivyignore, exit-code: "1", severity: "CRITICAL,HIGH" }
      - uses: bridgecrewio/checkov-action@v12
        with: { framework: terraform_plan, file: examples/basic/tfplan.json, skip_check: "CKV_AWS_18,CKV_AWS_21,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_62", soft_fail: false }
      - run: sha256sum versions.tf variables.tf main.tf outputs.tf examples/basic/main.tf > SHA256SUMS && cat SHA256SUMS
